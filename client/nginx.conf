# Static SPA server for the tengri-xc client. Installed as
# /etc/nginx/conf.d/default.conf (replaces the stock welcome page). Host Caddy
# terminates TLS and forwards everything except /api here; the API is a separate
# container, so nginx only ever serves static files + the SPA fallback.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-like responses; binaries (images, wasm, fonts) are already
    # compressed and gain nothing. gzip_vary lets caches key on Accept-Encoding.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Liveness for the Quadlet HealthCmd.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Vite fingerprints asset filenames, so a given name never changes content.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the fallback target and points at the current asset hashes;
    # never cache it, or a deploy leaves clients pinned to stale bundles.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: unknown paths fall back to index.html so client-side routes resolve.
    location / {
        try_files $uri /index.html;
    }
}
